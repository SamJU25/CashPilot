name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: |
          python -m pytest -ra --tb=short 2>&1 | tee test_output.txt
          test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f test_output.txt ]; then
            echo "### Backend Test Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash
      - name: Post failure comment to commit
        if: failure()
        run: |
          python -c "
          import urllib.request, json, os
          token = os.environ.get('GITHUB_TOKEN')
          sha = os.environ.get('GITHUB_SHA')
          repo = os.environ.get('GITHUB_REPOSITORY')
          if not token or not sha or not repo:
              exit(0)
          url = f'https://api.github.com/repos/{repo}/commits/{sha}/comments'
          output = ''
          if os.path.exists('test_output.txt'):
              with open('test_output.txt', 'r', encoding='utf-8', errors='replace') as f:
                  output = f.read()[-3000:]
          body = json.dumps({'body': f'### ❌ CI Test Failure Details\n\`\`\`\n{output}\n\`\`\`'}).encode('utf-8')
          req = urllib.request.Request(url, data=body, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json',
              'User-Agent': 'CI'
          })
          try:
              urllib.request.urlopen(req)
          except Exception as e:
              print('Failed to comment:', e)
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run type-check
      - name: Build frontend
        run: npm run build
