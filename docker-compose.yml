services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sme-finance-copilot-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - COPILOT_ENV=${COPILOT_ENV:-local}
      - COPILOT_LEDGER_DIR=/app/.data
      - COPILOT_SESSION_DIR=/app/.data/sessions
      - MAX_ANALYSIS_UPLOAD_BYTES=${MAX_ANALYSIS_UPLOAD_BYTES:-1048576}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TENANT_TOKEN_SECRET=${TENANT_TOKEN_SECRET:-}
      - TENANT_ENROLLMENT_KEY=${TENANT_ENROLLMENT_KEY:-}
      - TENANT_ENROLLMENT_KEYS=${TENANT_ENROLLMENT_KEYS:-}
      - TENANT_ENROLLMENT_TENANT_ID=${TENANT_ENROLLMENT_TENANT_ID:-}
      - TENANT_ENROLLMENT_ALLOW_ANY_TENANT=${TENANT_ENROLLMENT_ALLOW_ANY_TENANT:-}
      - COPILOT_DATA_KEY=${COPILOT_DATA_KEY:-}
      - DECISION_ADMIN_KEY=${DECISION_ADMIN_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
      - STAGED_INTENT_TTL_HOURS=${STAGED_INTENT_TTL_HOURS:-72}
      - STAGED_INTENT_DEDUPE_SECONDS=${STAGED_INTENT_DEDUPE_SECONDS:-300}
      - LLM_ALLOW_LOOPBACK_ENDPOINTS=${LLM_ALLOW_LOOPBACK_ENDPOINTS:-0}
      - LLM_ALLOW_PRIVATE_ENDPOINTS=${LLM_ALLOW_PRIVATE_ENDPOINTS:-0}
    volumes:
      - copilot-data:/app/.data
      # Downloaded base weights and the Hugging Face cache are multi-GB; keep them across restarts.
      - copilot-models:/app/models
      - copilot-hf-cache:/home/appuser/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - copilot-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: sme-finance-copilot-ui
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PORT=3000
      # The browser calls NEXT_PUBLIC_API_URL; the server-side token route reaches the backend over the compose network.
      - CASHPILOT_API_URL=http://backend:8000
      - TENANT_ENROLLMENT_KEY=${TENANT_ENROLLMENT_KEY:-}
      - TENANT_ENROLLMENT_TENANT_ID=${TENANT_ENROLLMENT_TENANT_ID:-}
      # Off by default: set to 1 only for a single-business deployment behind its own access control.
      - CASHPILOT_OPEN_SESSION=${CASHPILOT_OPEN_SESSION:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - copilot-net

networks:
  copilot-net:
    driver: bridge

volumes:
  copilot-data:
  copilot-models:
  copilot-hf-cache:
