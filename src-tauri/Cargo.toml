[package]
name = "cashpilot"
version = "1.0.0"
description = "CashPilot — Autonomous AI Financial Participant for SMEs"
authors = ["CashPilot Team"]
edition = "2021"

[lib]
name = "cashpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
sha2 = "0.10"
hex = "0.4"
keyring = "3.6"
